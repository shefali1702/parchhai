<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parchhai</title>
<meta name="description" content="Parchhai keeps the voices, stories and wisdom of your elders, in their own language, forever.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Tiro+Gurmukhi&family=Tiro+Tamil&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Sans+Gurmukhi:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070509;
    --bg-2: #0d0a10;
    --ink: #F4ECE1;
    --ink-2: rgba(244, 236, 225, .70);
    --ink-3: rgba(244, 236, 225, .45);
    --line: rgba(244, 236, 225, .12);
    --flame: #FFB86B;
    --flame-hot: #FFE6BD;
    --ember: #FF7A45;
    --sindoor: #B3261E;
    --plum: #120a1a;
    --display: "Instrument Serif", "Tiro Devanagari Hindi", "Tiro Gurmukhi", "Tiro Tamil", Georgia, serif;
    --body: "Manrope", "Noto Sans Devanagari", "Noto Sans Gurmukhi", "Noto Sans Tamil", system-ui, sans-serif;
    --lx: 50vw; --ly: 60vh;
    --gutter: clamp(16px, 5vw, 72px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  html.elder { font-size: 125%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--body);
    font-size: 1rem; line-height: 1.6; overflow-x: hidden;
  }
  body.gated { overflow: hidden; }
  html[lang="hi"] body, html[lang="pa"] body, html[lang="ta"] body { line-height: 1.75; }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--flame); outline-offset: 4px; border-radius: 6px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- atmosphere ---------- */
  #light {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(620px circle at var(--lx) var(--ly), rgba(255, 184, 107, .22), rgba(255, 122, 69, .07) 45%, transparent 70%),
      radial-gradient(1400px circle at var(--lx) var(--ly), rgba(255, 160, 90, .05), transparent 60%);
  }
  #embers { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .grain {
    position: fixed; inset: -50%; pointer-events: none; z-index: 60; opacity: .05;
    animation: grain 1s steps(5) infinite;
  }
  @keyframes grain { 0%{transform:translate(0,0)} 25%{transform:translate(-2%,3%)} 50%{transform:translate(3%,-1%)} 75%{transform:translate(-3%,-2%)} 100%{transform:translate(0,0)} }
  main, nav, footer { position: relative; z-index: 2; }
  main { overflow-x: clip; }

  #wick { position: fixed; top: 0; left: 0; height: 2px; width: 0; z-index: 70;
    background: linear-gradient(90deg, rgba(244,236,225,.15), var(--flame)); }
  #wick::after { content: ""; position: absolute; right: -5px; top: -5px; width: 12px; height: 12px; border-radius: 50%;
    background: radial-gradient(circle, var(--flame-hot), var(--flame) 40%, transparent 70%); filter: blur(.5px); }

  /* flame cursor */
  #cursor { position: fixed; left: 0; top: 0; z-index: 90; pointer-events: none; width: 22px; height: 30px;
    margin: -26px 0 0 -11px; opacity: 0; transition: opacity .4s; }
  body.flame-cursor #cursor { opacity: 1; }
  body.flame-cursor, body.flame-cursor * { cursor: none !important; }
  #cursor svg { width: 100%; height: 100%; overflow: visible; transform-origin: 50% 100%;
    animation: flick 1.4s ease-in-out infinite; transition: scale .25s; }
  #cursor.big svg { scale: 1.6; }

  /* ---------- diya ---------- */
  .diya { display: block; overflow: visible; }
  .diya .flame-g { transform-origin: 60px 62px; transform: scale(0); transition: transform 1s cubic-bezier(.2, 1.7, .4, 1); }
  .diya .flick { transform-origin: 60px 62px; }
  .diya.lit .flame-g { transform: scale(1); }
  .diya.lit .flick { animation: flick 1.7s ease-in-out infinite; }
  .diya .halo { opacity: 0; transition: opacity 1.4s ease; }
  .diya.lit .halo { opacity: 1; animation: halo 3.2s ease-in-out infinite; }
  .diya .ember { opacity: 0; transition: opacity .4s; }
  .diya.warm .ember { opacity: 1; animation: halo 1.2s ease-in-out infinite; }
  .diya .rimlight { opacity: .25; transition: opacity 1.4s; }
  .diya.lit .rimlight { opacity: 1; }
  @keyframes flick {
    0%, 100% { transform: scale(1, 1) skewX(0deg); }
    20% { transform: scale(.96, 1.05) skewX(1.5deg); }
    45% { transform: scale(1.03, .96) skewX(-1deg); }
    70% { transform: scale(.98, 1.03) skewX(.8deg); }
  }
  @keyframes halo { 0%, 100% { opacity: .85; } 50% { opacity: 1; } }

  /* ---------- gate ---------- */
  #gate {
    position: fixed; inset: 0; z-index: 100; isolation: isolate;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(28px, 6vh, 56px);
    padding: 24px 16px;
  }
  #gate::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(ellipse at 50% 60%, #120c14, #050306 70%);
    transition: opacity 1.2s ease; }
  #gate.leaving::before { opacity: 0; }
  #gate.leaving .brand, #gate.leaving .picked .lbl { opacity: 0; transition: opacity .6s; }
  #gate.leaving .gate-diya { outline: none; transform: none; }
  #gate .brand { opacity: .9; }
  .gate-title { font-family: var(--display); font-size: clamp(28px, 4.4vw, 52px); text-align: center; line-height: 1.15;
    min-height: 2.4em; display: grid; place-items: center; }
  .gate-title span { grid-area: 1 / 1; opacity: 0; transition: opacity 1s ease, filter 1s ease; filter: blur(6px); padding: 0 8px; }
  .gate-title span.on { opacity: 1; filter: blur(0); }
  .gate-diyas { display: flex; gap: clamp(8px, 4vw, 48px); flex-wrap: wrap; justify-content: center; }
  .gate-diya { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 8px; border-radius: 20px;
    transition: transform .4s cubic-bezier(.2,.8,.2,1), opacity .6s; }
  .gate-diya .diya { width: clamp(72px, 13vw, 128px); height: auto; }
  .gate-diya:hover, .gate-diya:focus-visible { transform: translateY(-6px); }
  .gate-diya:focus-visible { outline: 1px solid rgba(255, 184, 107, .35); outline-offset: 2px; }
  .gate-diya .lbl { font-family: var(--display); font-size: clamp(18px, 2.2vw, 24px); color: var(--ink-2); transition: color .3s; }
  .gate-diya:hover .lbl, .gate-diya:focus-visible .lbl { color: var(--flame-hot); }
  #gate.chosen .gate-diya:not(.picked), #gate.chosen .gate-title, #gate.chosen .gate-hint { opacity: 0; transition: opacity .6s; }
  .gate-hint { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); text-align: center; }
  .spark { position: fixed; width: 3px; height: 3px; border-radius: 50%; background: var(--flame-hot); z-index: 101;
    box-shadow: 0 0 6px var(--flame); pointer-events: none; }

  /* ---------- nav ---------- */
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 18px var(--gutter); transition: background .4s, backdrop-filter .4s, padding .4s; }
  nav.solid { background: rgba(7, 5, 9, .72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding-block: 12px;
    border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .brand svg { width: 26px; height: 36px; }
  .brand b { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 28px; letter-spacing: .01em; }
  .links { display: flex; gap: 28px; font-size: 14px; color: var(--ink-2); }
  .links a { text-decoration: none; transition: color .2s; }
  .links a:hover { color: var(--flame-hot); }
  .tools { display: flex; align-items: center; gap: 8px; }
  .langs { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .langs button { padding: 5px 10px; border-radius: 999px; font-size: 14px; color: var(--ink-2); transition: background .3s, color .3s; line-height: 1.2; }
  .langs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center;
    color: var(--ink-2); transition: border-color .3s, color .3s; }
  .icon-btn:hover, .icon-btn[aria-pressed="true"] { border-color: var(--flame); color: var(--flame-hot); }
  .icon-btn svg { width: 18px; height: 18px; }

  .btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 26px; border-radius: 999px; font-weight: 600;
    font-size: 15px; text-decoration: none; transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s, background .3s; }
  .btn-primary { background: linear-gradient(180deg, #FFD9A3, var(--flame)); color: #2a1306;
    box-shadow: 0 0 0 1px rgba(255, 230, 189, .4) inset, 0 10px 40px -10px rgba(255, 150, 70, .7); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 0 1px rgba(255,230,189,.6) inset, 0 16px 60px -10px rgba(255,150,70,.9); }
  .btn-ghost { border: 1px solid var(--line); color: var(--ink); }
  .btn-ghost:hover { border-color: rgba(255, 184, 107, .5); background: rgba(255, 184, 107, .06); }
  nav .btn { padding: 10px 18px; font-size: 14px; }

  /* ---------- shared section ---------- */
  section { position: relative; padding: clamp(96px, 16vh, 180px) var(--gutter); }
  .wrap { max-width: 1240px; margin: 0 auto; }
  .kicker { display: inline-flex; align-items: center; gap: 12px; font-size: 13px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--flame); font-weight: 600; }
  html:not([lang="en"]) .kicker { letter-spacing: .04em; font-size: 15px; }
  .kicker::before { content: ""; width: 28px; height: 1px; background: currentColor; }
  h2 { font-family: var(--display); font-weight: 400; font-size: clamp(38px, 6vw, 84px); line-height: 1.05; letter-spacing: -.01em;
    margin: 20px 0 0; max-width: 18ch; }
  html:not([lang="en"]) h2 { line-height: 1.3; font-size: clamp(32px, 5vw, 68px); max-width: 24ch; }
  h2 em, .hero em { font-style: italic; color: var(--flame); padding-right: .14em; }
  .lede { color: var(--ink-2); font-size: clamp(17px, 1.5vw, 20px); max-width: 56ch; margin-top: 22px; }

  .reveal { opacity: 0; transform: translateY(36px); filter: blur(10px);
    transition: opacity 1.1s cubic-bezier(.2,.7,.2,1), transform 1.1s cubic-bezier(.2,.7,.2,1), filter 1.1s; transition-delay: var(--d, 0s); }
  .reveal.in { opacity: 1; transform: none; filter: none; }
  [data-i18n] { transition: opacity .28s ease, filter .28s ease; }
  .swapping [data-i18n] { opacity: 0; filter: blur(6px); }

  /* glass card that catches the light */
  .card { position: relative; border: 1px solid var(--line); border-radius: 28px; padding: clamp(24px, 3vw, 40px);
    background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.01)); overflow: hidden; isolation: isolate; }
  .card::before { content: ""; position: absolute; inset: 0; z-index: -1; opacity: 0; transition: opacity .4s;
    background: radial-gradient(420px circle at var(--cx, 50%) var(--cy, 50%), rgba(255, 184, 107, .14), transparent 60%); }
  .card:hover::before { opacity: 1; }

  /* ---------- hero: dawn over the village ---------- */
  .hero { position: relative; min-height: 100svh; isolation: isolate; overflow: hidden;
    padding: clamp(118px, 17vh, 168px) var(--gutter) clamp(200px, 30vh, 330px); }
  .dawn { position: absolute; inset: 0; z-index: -1; pointer-events: none; --px: 0; --sy: 0; }
  .dawn .sky { position: absolute; inset: 0;
    background: linear-gradient(180deg, #0e0820 0%, #24123d 20%, #4d2052 38%, #8f3558 52%, #d0664f 64%, #f19a5c 73%, #f8c27f 80%, #fbd9a0 84%); }
  .dawn .stars { position: absolute; left: 0; top: 0; width: 1px; height: 1px; border-radius: 50%; animation: twinkle 5s ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: .35; } to { opacity: .85; } }
  .dawn .sun { position: absolute; left: 62%; top: 72%; width: clamp(120px, 13vw, 200px); aspect-ratio: 1; border-radius: 50%;
    translate: -50% -50%;
    background: radial-gradient(circle at 50% 42%, #fffaf0 0%, #ffe6b5 40%, #ffc27e 72%, #ff9b63 100%);
    box-shadow: 0 0 70px 24px rgba(255, 200, 130, .55), 0 0 240px 110px rgba(255, 140, 90, .35);
    transform: translate3d(calc(var(--px) * -10px), calc(var(--sy) * -.18px), 0); }
  .dawn .haze { position: absolute; left: 0; right: 0; top: 52%; height: 30%;
    background: radial-gradient(60% 100% at 66% 60%, rgba(255, 214, 160, .55), transparent 70%); mix-blend-mode: screen; }
  .clouds i { position: absolute; border-radius: 50%; background: rgba(255, 196, 186, .22); filter: blur(16px);
    animation: drift linear infinite; }
  @keyframes drift { from { transform: translateX(-20vw); } to { transform: translateX(120vw); } }
  .birds { position: absolute; left: 0; top: 30%; width: 120px; animation: fly 38s linear infinite; }
  .birds path { fill: none; stroke: #2a1430; stroke-width: 1.6; stroke-linecap: round; animation: flap .9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .birds path:nth-child(2) { animation-delay: .3s; } .birds path:nth-child(3) { animation-delay: .55s; }
  @keyframes flap { 50% { transform: scaleY(.45); } }
  @keyframes fly { from { transform: translate(-15vw, 0); } to { transform: translate(115vw, -60px); } }
  .layer { position: absolute; left: -5%; width: 110%; bottom: 0; height: 64%; overflow: visible;
    transform: translate3d(calc(var(--px) * var(--d) * -36px), calc(var(--sy) * var(--k) * 1px), 0); }
  .kite { animation: sway 6s ease-in-out infinite; transform-box: view-box; }
  .kite-2 { animation-duration: 8s; animation-delay: -3s; }
  @keyframes sway { 0%, 100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2deg); } }
  .kite .tail { animation: tail 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
  @keyframes tail { 50% { transform: skewX(12deg); } }
  .lamp-glow { animation: halo 2.4s ease-in-out infinite; }
  .dawn .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 16%; background: linear-gradient(180deg, transparent, var(--bg)); }

  .hero-inner { position: relative; max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
    gap: clamp(28px, 4vw, 64px); align-items: end; }
  .hero .kicker { color: #FFDDB0; opacity: 0; transition: opacity 1.2s .1s; }
  .hero h1 { font-family: var(--display); font-weight: 400; font-size: clamp(64px, 10.5vw, 176px); line-height: .9; letter-spacing: -.025em;
    margin-top: 22px; color: #FFF6EA; text-shadow: 0 6px 50px rgba(40, 10, 50, .35); }
  html:not([lang="en"]) .hero h1 { font-size: clamp(56px, 8.6vw, 140px); line-height: 1.18; letter-spacing: 0; }
  html[lang="ta"] .hero h1 { font-size: clamp(46px, 6.6vw, 108px); }
  .hero h1 .ln { display: block; opacity: 0; transform: translateY(60px); filter: blur(18px);
    transition: opacity 1.6s cubic-bezier(.2, .7, .2, 1), transform 1.8s cubic-bezier(.2, .7, .2, 1), filter 1.6s; }
  .hero h1 .ln + .ln { transition-delay: .28s; }
  .hero h1 em { font-style: italic; padding-right: .1em;
    background: linear-gradient(180deg, #FFF0D2 0%, #FFC27E 55%, #FF8F5E 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: none; filter: drop-shadow(0 6px 30px rgba(255, 150, 90, .35)); }
  .hero .sub { color: rgba(255, 240, 226, .88); font-size: clamp(17px, 1.45vw, 21px); max-width: 50ch; margin-top: 28px;
    opacity: 0; transition: opacity 1.4s .7s; }
  .hero .ctas { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 34px; opacity: 0; transition: opacity 1.4s .95s; }
  .hero .btn-ghost { background: rgba(255, 255, 255, .07); border-color: rgba(255, 236, 214, .32); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .trust { display: flex; flex-wrap: wrap; gap: 10px 26px; margin-top: 30px; font-size: 14px; color: rgba(255, 236, 214, .78);
    opacity: 0; transition: opacity 1.4s 1.2s; }
  .trust span::before { content: "✦"; color: #FFC27E; margin-right: 8px; font-size: 11px; }
  .np { justify-self: end; width: min(100%, 370px); padding: 22px; border-radius: 26px; color: var(--ink);
    background: linear-gradient(160deg, rgba(40, 18, 46, .58), rgba(20, 8, 26, .5)); border: 1px solid rgba(255, 228, 206, .2);
    backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3);
    box-shadow: 0 40px 90px -30px rgba(10, 0, 20, .7), inset 0 1px 0 rgba(255, 255, 255, .08);
    opacity: 0; transform: translateY(30px) rotate(1.5deg); transition: opacity 1.4s 1.3s, transform 1.6s 1.3s cubic-bezier(.2, .7, .2, 1); }
  .np .lbl { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #FFD9A3; font-weight: 600; }
  html:not([lang="en"]) .np .lbl { letter-spacing: .02em; font-size: 13px; }
  .np .lbl i { width: 7px; height: 7px; border-radius: 50%; background: #ff6a5a; box-shadow: 0 0 0 0 rgba(255, 106, 90, .6); animation: rec 1.6s infinite; }
  @keyframes rec { 70% { box-shadow: 0 0 0 8px rgba(255, 106, 90, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 106, 90, 0); } }
  .np .who { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
  .np .avatar { width: 52px; height: 52px; font-size: 22px; flex: none; }
  .np .nm { font-family: var(--display); font-size: 24px; line-height: 1.1; }
  .np .mt { font-size: 13px; color: var(--ink-3); }
  .np .eq { display: flex; align-items: center; gap: 3px; height: 46px; margin-top: 18px; }
  .np .eq i { flex: 1; border-radius: 3px; background: linear-gradient(180deg, #FFE0B0, #FFB86B); height: var(--h);
    animation: bar 1.3s ease-in-out infinite; animation-delay: calc(var(--k) * -.09s); transform-origin: center; }
  .np .o { margin-top: 16px; font-family: "Tiro Gurmukhi", serif; color: var(--ink-3); font-size: 15px; }
  .np .tr { font-family: var(--display); font-size: 21px; line-height: 1.3; margin-top: 4px; }
  .np a { display: inline-flex; align-items: center; gap: 6px; margin-top: 16px; font-size: 14px; color: #FFD9A3; text-decoration: none; }
  .np a:hover { text-decoration: underline; }
  body.entered .hero .kicker, body.entered .hero .sub, body.entered .hero .ctas, body.entered .trust { opacity: 1; }
  body.entered .hero h1 .ln { opacity: 1; transform: none; filter: none; }
  body.entered .np { opacity: 1; transform: rotate(1.5deg); }
  @media (max-width: 900px) {
    .hero-inner { grid-template-columns: 1fr; }
    .np { justify-self: start; }
    .layer { height: 52vh; width: 300%; left: -190%; }
    .dawn .sun { left: 58%; top: calc(100% - 30vh); }
  }

  /* ---------- splash ---------- */
  #splash { position: fixed; inset: 0; z-index: 95; display: none; overflow: hidden;
    background: radial-gradient(ellipse at 50% 85%, #1c1013 0%, #08060a 55%, #030204 100%); --glow: 0; }
  #splash.on { display: block; }
  #sp-embers { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  .sp-glow { position: absolute; left: var(--fx, 50%); top: var(--fy, 80%); width: 150vmax; height: 150vmax; z-index: 0; pointer-events: none;
    transform: translate(-50%, -50%); opacity: var(--glow);
    background: radial-gradient(circle, rgba(255, 196, 128, .30) 0%, rgba(255, 130, 70, .09) 20%, transparent 46%); }
  #splash .bar { position: absolute; left: 0; right: 0; height: 0; background: #000; z-index: 3; transition: height 1.4s cubic-bezier(.7, 0, .2, 1); }
  #splash .bar.t { top: 0; } #splash .bar.b { bottom: 0; }
  #splash.go .bar { height: 8vh; }
  .sp-skip { position: absolute; top: 18px; right: 20px; z-index: 5; font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-3); padding: 8px 12px; border-radius: 999px; transition: color .3s; }
  .sp-skip:hover { color: var(--ink); }
  .sp-stage { position: absolute; inset: 8vh 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0 16px; }
  .sp-top { font-family: var(--display); font-style: italic; font-size: clamp(22px, 3vw, 42px); color: var(--ink-2);
    letter-spacing: .32em; opacity: 0; filter: blur(12px); transform: translateY(10px);
    transition: opacity 2s ease, filter 2s ease, transform 2s ease, letter-spacing 3s cubic-bezier(.2, .7, .2, 1); }
  html:not([lang="en"]) .sp-top { letter-spacing: 0; font-style: normal; }
  #splash.s1 .sp-top { opacity: 1; filter: none; transform: none; letter-spacing: .06em; }
  html:not([lang="en"]) #splash.s1 .sp-top { letter-spacing: 0; }
  .sp-word { position: relative; font-family: var(--display); font-size: clamp(76px, 16.5vw, 250px); line-height: 1.08; white-space: nowrap;
    margin: .02em 0 .06em; }

      // deep sub hit as the title lands

  function frame(now) {

      }
    }

    // wick progress
    const h = document.documentElement.scrollHeight - innerHeight;
    $("#wick").style.width = (h > 0 ? scrollY / h * 100 : 0) + "%";

    if (splashOn) drawSplash(now);
    drawManifesto();
    drawSky(now);
    tickPlayer(now);
    requestAnimationFrame(frame);
  }

  /* nav + cards catching the light */
  addEventListener("scroll", () => $("#nav").classList.toggle("solid", scrollY > 40), { passive: true });
  $$(".card").forEach(c => c.addEventListener("pointermove", e => {
    const r = c.getBoundingClientRect(); c.style.setProperty("--cx", (e.clientX - r.left) + "px"); c.style.setProperty("--cy", (e.clientY - r.top) + "px");
  }));

  /* reveals + counters */
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.add("in");
    e.target.querySelectorAll?.("[data-count]").forEach(countUp);
    if (e.target.id === "finale-diya") setTimeout(() => { e.target.querySelector(".diya").classList.add("lit"); }, 500);
    io.unobserve(e.target);
  }), { threshold: .18 });
  $$(".reveal").forEach(el => io.observe(el));
  function countUp(el) {
    const to = +el.dataset.count, from = +(el.dataset.from || 0), suf = el.dataset.suffix || "", t0 = performance.now(), dur = 2000;
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 4);
      el.textContent = Math.round(from + (to - from) * e) + suf;
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  /* how-it-works waveform */
  $("#bars").innerHTML = Array.from({ length: 28 }, (_, k) => `<i style="--k:${k}; height:${30 + Math.abs(Math.sin(k * 1.7)) * 70}%"></i>`).join("");

  /* =====================================================================
     Story player (subtitles demo)
     ===================================================================== */
  const DUR = [4200, 3800, 4800], TOTAL = DUR.reduce((a, b) => a + b);
  const wave = $("#wave"), NB = 72;
  wave.innerHTML = Array.from({ length: NB }, (_, i) => {
    const h = 18 + Math.abs(Math.sin(i * .9) * Math.cos(i * .23)) * 70 + (i % 7 === 0 ? 10 : 0);
    return `<i style="--h:${Math.min(100, h)}%"></i>`;
  }).join("");
  const bars = [...wave.children];
  let playing = false, pos = 0, lastT = 0, curLine = -1;
  function lineAt(p) { let acc = 0; for (let i = 0; i < DUR.length; i++) { if (p < acc + DUR[i]) return [i, (p - acc) / DUR[i]]; acc += DUR[i]; } return [DUR.length - 1, 1]; }
  function renderPlayerLine(force) {
    const [i, k] = lineAt(pos);
    if (i !== curLine || force) {
      curLine = i;
      $("#orig").textContent = ORIG[i];
      $("#tr").innerHTML = t("pl.lines")[i].split(" ").map(w => `<span class="w">${w}</span> `).join("");
    }
    const ws = $$("#tr .w"), on = pos === 0 && !playing ? 0 : Math.ceil(k * ws.length);
    ws.forEach((w, j) => w.classList.toggle("on", j < on));
    const done = Math.floor(pos / TOTAL * NB);
    bars.forEach((b, j) => b.classList.toggle("done", j < done));
  }
  function tickPlayer(now) {
    const dt = now - (lastT || now); lastT = now;
    if (!playing) return;
    pos += dt;
    if (pos >= TOTAL) { pos = 0; playing = false; setPlayIcon(); }
    renderPlayerLine();
  }
  const setPlayIcon = () => { $("#play-ic").setAttribute("d", playing ? "M7 5h4v14H7zM13 5h4v14h-4z" : "M8 5v14l11-7z"); $("#play").setAttribute("aria-label", playing ? "Pause" : "Play story"); };
  $("#play").addEventListener("click", () => { playing = !playing; Sound.tick(); setPlayIcon(); });

  /* =====================================================================
     Memory sky
     ===================================================================== */
  const sky = $("#sky"), sctx = sky.getContext("2d"), tip = $("#tip"), skyWrap = $("#sky-wrap");
  let skyVisible = false, SW = 0, SH = 0, mouse = { x: -1, y: -1, px: 0, py: 0 };
  const rng = (s => () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296)(7);
  const CENTERS = [[.17, .3], [.42, .2], [.72, .28], [.25, .72], [.55, .64], [.84, .7]];
  const ELDERS = ["Nani", "Dadi", "Nana ji", "Dada ji", "Paati", "Thatha", "Biji", "Amma"];
  const consts = CENTERS.map(([cx, cy], ci) => {
    const n = 6 + Math.floor(rng() * 4);
    const stars = Array.from({ length: n }, () => {
      const a = rng() * 6.283, d = .03 + rng() * .09;
      return { x: cx + Math.cos(a) * d * 1.3, y: cy + Math.sin(a) * d, b: .35 + rng() * .65, ph: rng() * 6.28,
        who: ELDERS[Math.floor(rng() * ELDERS.length)], year: 1940 + Math.floor(rng() * 50), ci };
    }).sort((a, b) => a.x - b.x);
    return { cx, cy, stars, label: "" };
  });
  const dust = Array.from({ length: 360 }, () => ({ x: rng(), y: rng(), r: rng() * 1.1 + .2, ph: rng() * 6.28, z: .2 + rng() * .8 }));
  function skyLabels() { const names = t("sky.c"); consts.forEach((c, i) => c.label = names[i]); }
  function sizeSky() {
    const dpr = Math.min(devicePixelRatio || 1, 2), r = sky.getBoundingClientRect();
    SW = r.width; SH = r.height; sky.width = SW * dpr; sky.height = SH * dpr; sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  new IntersectionObserver(es => { skyVisible = es[0].isIntersecting; if (skyVisible) sizeSky(); }).observe(skyWrap);
  addEventListener("resize", () => skyVisible && sizeSky());
  skyWrap.addEventListener("pointermove", e => { const r = skyWrap.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; });
  skyWrap.addEventListener("pointerleave", () => { mouse.x = -1; tip.classList.remove("on"); });
  let hoverStar = null, hoverConst = -1, prevHover = null;
  function drawSky(now) {
    if (!skyVisible || !SW) return;
    const calm = root.classList.contains("calm"), tt = now / 1000;
    mouse.px += (((mouse.x < 0 ? SW / 2 : mouse.x) / SW - .5) - mouse.px) * .05;
    mouse.py += (((mouse.x < 0 ? SH / 2 : mouse.y) / SH - .5) - mouse.py) * .05;
    sctx.clearRect(0, 0, SW, SH);
    for (const d of dust) {
      const x = (d.x - mouse.px * .03 * d.z) * SW, y = (d.y - mouse.py * .03 * d.z) * SH;
      sctx.fillStyle = `rgba(244,236,225,${(.15 + .35 * (calm ? .5 : .5 + .5 * Math.sin(tt * 1.3 + d.ph))) * d.z})`;
      sctx.fillRect(x, y, d.r, d.r);
    }
    const pos = s => [(s.x - mouse.px * .06) * SW, (s.y - mouse.py * .06) * SH];
    hoverStar = null; hoverConst = -1; let best = 26;
    if (mouse.x >= 0) consts.forEach((c, ci) => c.stars.forEach(s => {
      const [x, y] = pos(s), d = Math.hypot(x - mouse.x, y - mouse.y);
      if (d < best) { best = d; hoverStar = s; }
      if (Math.hypot(x - mouse.x, y - mouse.y) < 130) hoverConst = ci;
    }));
    if (hoverStar) hoverConst = hoverStar.ci;
    consts.forEach((c, ci) => {
      const hot = ci === hoverConst;
      sctx.strokeStyle = hot ? "rgba(255,184,107,.55)" : "rgba(244,236,225,.12)"; sctx.lineWidth = hot ? 1.2 : .8;
      sctx.beginPath(); c.stars.forEach((s, i) => { const [x, y] = pos(s); i ? sctx.lineTo(x, y) : sctx.moveTo(x, y); }); sctx.stroke();
      c.stars.forEach(s => {
        const [x, y] = pos(s), tw = calm ? 1 : .75 + .25 * Math.sin(tt * 2 + s.ph), on = s === hoverStar;
        const R = (2 + s.b * 3.2) * (on ? 1.8 : 1) * tw;
        const g = sctx.createRadialGradient(x, y, 0, x, y, R * 6);
        g.addColorStop(0, `rgba(255,214,160,${.55 * s.b + (hot ? .25 : 0)})`); g.addColorStop(1, "rgba(255,160,90,0)");
        sctx.fillStyle = g; sctx.beginPath(); sctx.arc(x, y, R * 6, 0, 6.283); sctx.fill();
        sctx.fillStyle = on ? "#fff" : "#FFE9C8"; sctx.beginPath(); sctx.arc(x, y, R * .45, 0, 6.283); sctx.fill();
      });
      const [lx, ly] = pos({ x: c.cx, y: c.cy + .15 });
      sctx.font = `400 ${hot ? 24 : 18}px ${getComputedStyle(document.body).getPropertyValue("--display") || "serif"}`;
      sctx.textAlign = "center"; sctx.fillStyle = hot ? "rgba(255,214,160,.95)" : "rgba(244,236,225,.35)";
      sctx.fillText(c.label, lx, Math.min(SH - 50, ly));
    });
    if (hoverStar) {
      const [x, y] = pos(hoverStar);
      tip.style.left = x + "px"; tip.style.top = y + "px";
      tip.innerHTML = `<b>${hoverStar.who}, ${hoverStar.year}</b>${consts[hoverStar.ci].label}`;
      tip.classList.add("on");
      if (prevHover !== hoverStar) Sound.tick();
    } else tip.classList.remove("on");
    prevHover = hoverStar;
  }

  /* =====================================================================
     Ask Parchhai
     ===================================================================== */
  let lastAnswer = null, asking = 0;
  function renderChips() {
    $("#chips").innerHTML = t("ask.q").map((q, i) => `<button type="button" data-q="${i}">${q}</button>`).join("");
    $$("#chips button").forEach(b => b.addEventListener("click", () => ask(+b.dataset.q, true)));
  }
  function ask(i, type) {
    const id = ++asking, input = $("#ask-in"), q = t("ask.q")[i], ans = $("#answer");
    Sound.tick();
    const run = async () => {
      if (type && !root.classList.contains("calm")) {
        input.value = "";
        for (const ch of q) { if (id !== asking) return; input.value += ch; await new Promise(r => setTimeout(r, 28)); }
      } else input.value = q;
      ans.innerHTML = `<div class="searching"><span class="dots"><i></i><i></i><i></i></span><span>${t("ask.searching")}</span></div>`;
      await new Promise(r => setTimeout(r, root.classList.contains("calm") ? 0 : 1300));
      if (id !== asking) return;
      renderAnswer(i, true);
    };
    run();
  }
  function renderAnswer(i, sound) {
    lastAnswer = i; const m = ASK_META[i];
    const bars = Array.from({ length: 36 }, (_, k) => `<i style="--h:${20 + Math.abs(Math.sin(k * 1.3 + i)) * 80}%" class="${k < 12 ? "done" : ""}"></i>`).join("");
    $("#answer").innerHTML = `<div class="ans-card">
      <div class="avatar" lang="${m.ilang}">${m.initial}</div>
      <div><div class="row"><b style="color:var(--flame-hot);font-weight:600">${m.who}</b> · ${m.year} · ${t("ask.orig")}: <span lang="${m.ilang}">${m.langName}</span></div>
      <div class="q">“${t("ask.a")[i]}”</div>
      <div class="row"><span class="ask-mini"><span class="a"><span class="play"></span></span></span><div class="wave">${bars}</div><span>0:${(14 + i * 9)}</span></div></div></div>`;
    if (sound) Sound.bell();
  }
  $("#ask-form").addEventListener("submit", e => {
    e.preventDefault();
    const v = $("#ask-in").value.toLowerCase();
    const i = /saag|साग|ਸਾਗ|கீரை|recipe|cook|रसोई|ਰਸੋਈ|சமை/.test(v) ? 1 : /fail|हार|ਹਾਰ|தோல்வி|thatha|थाथा|ਥਾਥਾ|தாத்தா/.test(v) ? 2 : 0;
    ask(i, false);
  });

  /* =====================================================================
     Time capsule: press and hold to break the seal
     ===================================================================== */
  const seal = $("#seal"), zone = $("#seal-zone"), prog = $("#seal-prog"), C = 295.3;
  let hold = 0, holding = false, holdRaf, opened = false, holdT = 0;
  function holdLoop(now = performance.now()) {
    const dt = Math.min(64, now - (holdT || now)); holdT = now;
    hold = Math.max(0, Math.min(1, hold + (holding ? dt / 1200 : -dt / 500)));
    prog.style.strokeDashoffset = C * (1 - hold);
    seal.style.transform = holding ? `rotate(${(Math.random() - .5) * hold * 6}deg) scale(${1 - hold * .04})` : "";
    if (hold >= 1 && !opened) {
      opened = true; holding = false; seal.classList.add("open"); zone.classList.add("open"); Sound.crack(); Sound.bell(.25);
      const r = seal.getBoundingClientRect(); sparks(r.left + r.width / 2, r.top + r.height / 2, 18);
      prog.style.strokeDashoffset = C; seal.style.transform = ""; return;
    }
    if (holding || hold > 0) holdRaf = requestAnimationFrame(holdLoop); else holdT = 0;
  }
  const startHold = e => { if (opened) return; e.preventDefault(); holding = true; Sound.init(); cancelAnimationFrame(holdRaf); holdT = 0; holdLoop(); };
  const endHold = () => { holding = false; };
  seal.addEventListener("pointerdown", startHold);
  addEventListener("pointerup", endHold); seal.addEventListener("pointerleave", endHold);
  seal.addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && !e.repeat) startHold(e); });
  seal.addEventListener("keyup", endHold);
  $("#reseal").addEventListener("click", () => { opened = false; hold = 0; seal.classList.remove("open"); zone.classList.remove("open"); seal.focus(); });

  /* =====================================================================
     Elder mode + calm mode
     ===================================================================== */
  function setElder(on) {
    root.classList.toggle("elder", on); store.set("parchhai-elder", on ? "1" : "0");
    $("#elder-btn").setAttribute("aria-pressed", String(on)); $("#elder-nav").setAttribute("aria-pressed", String(on));
    if (skyVisible) sizeSky();
  }
  function setCalm(on) {
    root.classList.toggle("calm", on); store.set("parchhai-calm", on ? "1" : "0");
    $("#calm-btn").setAttribute("aria-pressed", String(on));
    document.body.classList.toggle("flame-cursor", !on && finePointer && document.body.classList.contains("entered"));
    if (on) $$(".reveal").forEach(el => el.classList.add("in"));
  }
  $("#elder-btn").addEventListener("click", () => setElder(!root.classList.contains("elder")));
  $("#elder-nav").addEventListener("click", () => setElder(!root.classList.contains("elder")));
  $("#calm-btn").addEventListener("click", () => setCalm(!root.classList.contains("calm")));

  /* boot */
  setElder(store.get("parchhai-elder") === "1");
  setCalm(store.get("parchhai-calm") === "1" || prefersReduced);
  applyLang(store.get("parchhai-lang") || "en", false);
  const remembered = store.get("parchhai-lang");
  let seen = false;
  try { seen = sessionStorage.getItem("parchhai-entered") === "1"; } catch {}
  if (seen) {
    /* already watched the splash in this visit: go straight to the homepage, quietly */
    gate.remove(); splash.remove();
    document.body.classList.remove("gated"); document.body.classList.add("entered");
    if (finePointer && !root.classList.contains("calm")) document.body.classList.add("flame-cursor");
  } else if (remembered) $(`.gate-diya[data-lang="${remembered}"]`)?.focus({ preventScroll: true });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
