<!doctype html>
<html lang="en" data-title="vt.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault · Parchhai</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Tiro+Gurmukhi&family=Tiro+Tamil&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Sans+Gurmukhi:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .profile { display: flex; align-items: flex-end; gap: clamp(20px, 3vw, 36px); flex-wrap: wrap; }
  .profile h1 { margin-top: 6px; }
  .profile .meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; color: rgba(255, 240, 226, .85); font-size: 15px; }
  .profile .meta span + span::before { content: "·"; margin-right: 18px; opacity: .6; }
  .stats { display: flex; gap: clamp(20px, 4vw, 48px); margin-top: 26px; }
  .stats b { display: block; font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: clamp(36px, 4vw, 52px); line-height: 1; color: #FFF6EA; }
  .stats span { font-size: 13px; color: rgba(255, 240, 226, .78); }
  .elders { position: absolute; top: clamp(18px, 3vh, 28px); right: var(--gutter); display: flex; gap: 8px; align-items: center; z-index: 2; }
  .elders a, .elders button { border-radius: 50%; transition: transform .25s; }
  .elders .avatar { width: 40px; height: 40px; font-size: 17px; }
  .elders [aria-current="true"] .avatar { box-shadow: 0 0 0 2px #FFF6EA, 0 8px 24px -8px rgba(255, 140, 90, .8); }
  .elders a:hover { transform: translateY(-2px); }
  .elders .add { width: 40px; height: 40px; display: grid; place-items: center; border: 1px dashed rgba(255, 240, 226, .5); color: #FFF6EA; }
  .elders .add svg { width: 18px; height: 18px; }

  .toolbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; }
  .search { display: flex; align-items: center; gap: 12px; padding: 6px 8px 6px 20px; border-radius: 999px; border: 1px solid rgba(255, 201, 148, .3);
    background: rgba(255, 244, 232, .04); box-shadow: 0 0 60px -30px rgba(255, 150, 90, .6); }
  .search svg { width: 20px; height: 20px; color: var(--peach); flex: none; }
  .search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; padding: 12px 0; font-size: 16px; }
  .views { display: inline-flex; padding: 4px; border-radius: 999px; border: 1px solid var(--line); }
  .views button { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; font-size: 14px; color: var(--ink-2); }
  .views button svg { width: 16px; height: 16px; }
  .views button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .filters { margin-top: 16px; }

  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 26px; }
  .story { display: flex; flex-direction: column; gap: 14px; }
  .story .top { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
  .story .q { font-family: var(--display); font-size: clamp(22px, 2vw, 28px); line-height: 1.25; }
  .story .q[lang="hi"], .story .q[lang="pa"], .story .q[lang="ta"] { line-height: 1.5; font-size: clamp(19px, 1.8vw, 24px); }
  .story .qt { color: var(--ink-3); font-size: 14px; margin-top: -8px; }
  .story .player { display: flex; align-items: center; gap: 12px; }
  .story .text { color: var(--ink-2); line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .story.open .text { -webkit-line-clamp: unset; display: block; }
  .story .tl { color: var(--ink-3); font-style: italic; font-size: 15px; }
  .story mark { background: rgba(255, 201, 148, .3); color: var(--ink); border-radius: 4px; padding: 0 2px; }
  .story .foot-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; flex-wrap: wrap; }
  .story .actions { display: flex; gap: 4px; }
  .story .actions .btn { padding: 8px 12px; font-size: 13px; }
  .nomatch { text-align: center; padding: 48px 16px; color: var(--ink-3); }

  .sky-wrap { position: relative; height: min(70vh, 640px); margin-top: 26px; border-radius: 30px; overflow: hidden; border: 1px solid var(--line);
    background: radial-gradient(ellipse at 50% 120%, #2a1530, #0d0814 60%, #06040a); }
  #sky { width: 100%; height: 100%; display: block; cursor: crosshair; }
  .tip { position: absolute; pointer-events: none; padding: 10px 14px; border-radius: 14px; background: rgba(14, 8, 18, .88); border: 1px solid rgba(255, 201, 148, .35);
    font-size: 13px; transform: translate(-50%, calc(-100% - 14px)); opacity: 0; transition: opacity .2s; max-width: 280px; }
  .tip.on { opacity: 1; }
  .tip b { display: block; font-family: var(--display); font-weight: 400; font-size: 18px; color: #FFE6C4; line-height: 1.3; }
  .sky-hint { position: absolute; left: 20px; bottom: 16px; font-size: 13px; color: var(--ink-3); }

  .sheet .q { font-family: var(--display); font-size: clamp(26px, 3vw, 36px); line-height: 1.3; margin-top: 12px; padding-right: 40px; }
  .sheet .player { display: flex; align-items: center; gap: 12px; margin-top: 22px; }
  .sheet .text { margin-top: 22px; font-size: 18px; line-height: 1.8; }
  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr; }
    .toolbar { grid-template-columns: 1fr; }
    .elders { position: static; margin-bottom: 18px; }
  }
</style>
</head>
<body data-page="vault">
<main>
  <header class="page-hero" id="hero">
    <div class="elders" id="elders"></div>
    <div class="wrap" id="profile"></div>
  </header>

  <section class="section overlap" id="body">
    <div class="wrap">
      <div class="card glass" id="panel">
        <div class="toolbar">
          <label class="search"><span data-icon="search"></span><span class="sr-only" data-i18n="vt.ask"></span><input id="q" type="search" autocomplete="off" data-i18n-ph="vt.ask"></label>
          <div class="views" role="group">
            <button aria-pressed="true" data-view="list"><span data-icon="list"></span><span data-i18n="vt.list"></span></button>
            <button aria-pressed="false" data-view="sky"><span data-icon="star"></span><span data-i18n="vt.sky"></span></button>
          </div>
        </div>
        <div class="chips filters" id="filters"></div>
      </div>
      <div class="grid" id="grid"></div>
      <div class="sky-wrap" id="sky-wrap" hidden>
        <canvas id="sky" role="img" data-i18n-aria="vt.skyAria"></canvas>
        <div class="tip" id="tip"></div>
        <div class="sky-hint" data-i18n="vt.skyHint"></div>
      </div>
    </div>
  </section>
</main>

<dialog class="sheet" id="sheet">
  <button class="icon-btn sheet-close" id="sheet-close" data-i18n-aria="c.close"><span data-icon="close"></span></button>
  <div class="sheet-body" id="sheet-body"></div>
</dialog>

<script src="assets/js/core.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/questions.js"></script>
<script src="assets/js/player.js"></script>
<script src="assets/js/pages/vault.js"></script>
</body>
</html>
